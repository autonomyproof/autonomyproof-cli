name: "AutonomyProof"
description: "Scan AI-agent code for unsafe authority and fail the pull request that grants new unsafe authority."
author: "AutonomyProof"
branding:
  icon: "shield"
  color: "yellow"

inputs:
  target:
    description: "Path to scan."
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the build: critical | high | medium | low | none."
    required: false
    default: "high"
  baseline:
    description: "Optional baseline file. When set, the build fails only on findings absent from it (authority-regression gate)."
    required: false
    default: ""
  format:
    description: "Report format: html | json | sarif | all."
    required: false
    default: "sarif"
  output:
    description: "Directory for the generated report(s)."
    required: false
    default: "."
  version:
    description: "Version of the autonomyproof package to install (e.g. 0.2.0). Defaults to the release matching the action tag you pinned (e.g. @v0.2.0 installs 0.2.0); falls back to latest for branch/SHA refs."
    required: false
    default: ""
  args:
    description: "Extra arguments passed verbatim to `autonomyproof scan`."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install AutonomyProof
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          # Explicit override always wins.
          python -m pip install --upgrade "autonomyproof==${{ inputs.version }}"
        elif [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          # Pinned to a release tag (e.g. @v0.2.0): install the matching scanner version.
          python -m pip install --upgrade "autonomyproof==${ACTION_REF#v}"
        else
          # Branch or SHA ref: no matching release, use the latest published version.
          python -m pip install --upgrade autonomyproof
        fi

    - name: Scan
      shell: bash
      run: |
        baseline_arg=""
        if [ -n "${{ inputs.baseline }}" ]; then
          baseline_arg="--baseline ${{ inputs.baseline }}"
        fi
        autonomyproof scan "${{ inputs.target }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --format "${{ inputs.format }}" \
          --output "${{ inputs.output }}" \
          $baseline_arg ${{ inputs.args }}
