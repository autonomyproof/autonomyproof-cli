name: "🐛 Bug report"
description: Something crashed or behaved incorrectly (not a false positive — use the other form for that).
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. autonomyproof scan ./my-agent
        2. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Version & OS
      placeholder: "autonomyproof 0.15.0, Python 3.12, macOS 14"
    validations:
      required: true
