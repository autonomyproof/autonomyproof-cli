[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autonomyproof"
version = "0.7.0"
description = "Open-source local scanner that finds unsafe capabilities and missing guardrails in Python AI-agent code."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AutonomyProof" }]
keywords = ["ai", "agents", "security", "guardrails", "sast", "llm", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://autonomyproof.io"
Documentation = "https://github.com/autonomyproof/autonomyproof-cli#readme"
Source = "https://github.com/autonomyproof/autonomyproof-cli"
Issues = "https://github.com/autonomyproof/autonomyproof-cli/issues"

[project.scripts]
autonomyproof = "autonomyproof.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autonomyproof"]

[tool.hatch.build.targets.sdist]
include = ["src/autonomyproof", "README.md", "LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=autonomyproof --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["autonomyproof"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# examples/ contains intentionally-vulnerable code used as scanner fixtures.
extend-exclude = ["examples", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "PTH", "RUF"]
# Rule metadata (remediation lists, mappings) are immutable constants copied at use
# via list(); RUF012's ClassVar requirement adds noise without safety here.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests embed short Python snippets as inline strings; some exceed the line limit.
"tests/*" = ["E501"]
# The HTML report is an inline Jinja template; template markup lines can be long.
"src/autonomyproof/reporters/html_reporter.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/autonomyproof"]
warn_unused_ignores = true
disallow_untyped_defs = true
