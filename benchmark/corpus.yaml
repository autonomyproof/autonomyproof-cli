  - {id: ag002-neg-literal, rule: AG002, label: negative, code: "import ast\ndef r(x):\n    return ast.literal_eval(x)\n"}
  - {id: ag002-neg-json, rule: AG002, label: negative, code: "import json\ndef r(x):\n    return json.loads(x)\n"}

