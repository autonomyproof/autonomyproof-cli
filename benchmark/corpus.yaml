# Ground-truth labeled corpus. Each case targets ONE rule and is labeled:
#   positive = the target rule SHOULD fire   |   negative = it MUST NOT fire
# Evaluated by benchmark/corpus_eval.py (precision + recall per rule).
cases:
  # --- AG001 shell ---
  - {id: ag001-pos-shelltrue, rule: AG001, label: positive, code: "import subprocess\ndef r(cmd):\n    return subprocess.run(cmd, shell=True)\n"}
  - {id: ag001-pos-ossystem, rule: AG001, label: positive, code: "import os\ndef r(cmd):\n    return os.system(cmd)\n"}
  - {id: ag001-neg-list, rule: AG001, label: negative, code: "import subprocess\nsubprocess.run(['ls', '-la'])\n"}
  - {id: ag001-neg-shellfalse, rule: AG001, label: negative, code: "import subprocess\ndef r(cmd):\n    return subprocess.run(cmd, shell=False)\n"}

